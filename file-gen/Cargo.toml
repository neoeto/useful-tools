[package]
name = "file-gen"
version = "0.1.0"
edition = "2021"
description = "Generate files with an exact requested size"

[[bin]]
name = "file-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
