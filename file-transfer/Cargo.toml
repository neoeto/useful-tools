[package]
name = "file-transfer"
version = "0.1.0"
edition = "2021"
description = "Resumable TCP file transfer tool"

[dependencies]
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
filetime = "0.2"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "file-transfer"
path = "src/main.rs"
